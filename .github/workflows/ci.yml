name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:        #job name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Application
        run: |
         if ! test -f app/index.html; then
           echo "::error::Application file is missing"
           exit 1
         fi

         if ! grep -q "DevOps App" app/index.html; then
          echo "::error::Expected text 'DevOps App' not found"
          exit 1
         fi

      - name: Build Docker Image
        run: docker build -t k8s-cicd-lab:ci .

  publish:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest


    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}
      
      - name: build and push Docker image 
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"

          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE" .

          docker push "$IMAGE"
          echo " published : $IMAGE"


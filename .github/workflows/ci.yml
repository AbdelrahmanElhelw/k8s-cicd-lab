name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:        #job name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Application
        run: |
          test -f app/index.html
          grep -q "DevOps App" app/index.html

      - name: Build Docker Image
        run: docker build -t k8s-cicd-lab:ci .

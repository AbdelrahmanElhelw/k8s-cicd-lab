name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:        #job name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Application
        run: |
         if ! test -f app/index.html; then
           echo "::error::Application file is missing"
           exit 1
         fi

         if ! grep -q "DevOps App" app/index.html; then
          echo "::error::Expected text 'DevOps App' not found"
          exit 1
         fi

      - name: Build Docker Image
        run: docker build -t k8s-cicd-lab:ci .

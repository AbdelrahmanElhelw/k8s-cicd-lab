name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:

  build:        #job name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Application
        run: |
         if ! test -f app/index.html; then
           echo "::error::Application file is missing"
           exit 1
         fi

         if ! grep -q "DevOps App" app/index.html; then
          echo "::error::Expected text 'DevOps App' not found"
          exit 1
         fi

      - name: Build Docker Image
        run: docker build -t k8s-cicd-lab:ci .

  publish:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest


    permissions:
      contents: write   #To write in Repo file " Kubernetes Manifests"
      packages: write   #To push Image to GHCR

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN}}
      
      - name: build and push Docker image 
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"

          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$IMAGE" .

          docker push "$IMAGE"
          echo " published : $IMAGE"

      - name: Update Kubernetes Image Tag
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"

          sed -i -E "s|(^[[:space:]]*image:[[:space:]]*).*|\1${IMAGE}|" k8s/deployment.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- k8s/deployment.yml; then
             echo "Image tag already up to date"
             exit 0
          fi

          git add k8s/deployment.yml
          git commit -m "chore: update deployment image [skip ci]"
          git push origin HEAD:main

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permission:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Puplish Release Image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          SOURCE_IMAGE=$(awk '$1== 'image:' {print $2; exit} k8s/deploymeny.yml)
          RELEASE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"

          docker buildx imagetools inspect "$SOURCE_IMAGE"

          docker buildx imagetools create --prefer-index=false -t "$RELEASE_IMAGE" "$SOURCE_IMAGE"




          


apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: devops-route
  namespace: default

spec:
  parentRefs:
    - name: devops-gateway
      sectionName: http

  hostnames:
    - devops.test

  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: devops-service
          port: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
      metadata:
        labels:
          app: devops-app
      spec:
        containers:
          - name: nginx
            image: ghcr.io/abdelrahmanelhelw/k8s-cicd-lab:sha-601f73a
            ports:
              - containerPort: 80 
